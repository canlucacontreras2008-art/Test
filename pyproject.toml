[project]
name = "order-broker"
version = "0.1.0"
description = "WebSocket broker for receiving and dispatching messages/orders between programs"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["order_broker*"]
